# Full rationale, server layout, required secrets, and dry-run instructions:
# see ../../docs/DEPLOYMENT.md. Deploys to o2switch over SSH (shared cPanel
# hosting) -- no logic here should change without reading that doc first.
#
# Triggered by ci-backend.yml succeeding on master (not by push directly):
# lint/test/audit/phpstan/cs-fixer are that separate workflow's job now,
# not duplicated here. Still a single job below despite that split --
# the runner's IP must be whitelisted on o2switch (cPanel > Sécurité > Accès
# SSH) by hand before the SSH/rsync steps below can connect (each GitHub
# Actions job gets its own runner VM, and its own public IP), so the "Get
# runner public IP" step needs to run in the same job as SSH/rsync for the
# printed IP to be the one that actually needs whitelisting.

name: Deploy chat-ia (backend)

on:
  workflow_run:
    workflows: ['CI (backend)']
    branches: [master]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (rsync --dry-run, skip .env write and migrations)'
        type: boolean
        default: false

# Queues overlapping runs instead of letting them race: two concurrent runs
# would rsync to the same remote path at once.
concurrency:
  group: deploy-backend-${{ github.ref }}

jobs:
  deploy:
    name: Deploy
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-backend
      url: https://chatbot.jolivetmaxime.fr
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      # Pins to the exact commit ci-backend.yml just validated, not
      # whatever master happens to be when this job starts -- avoids a race
      # if another push landed on master between the two workflows.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Moved ahead of the build steps so the IP to whitelist manually on
      # o2switch (cPanel > Sécurité > Accès SSH) is visible in the
      # log/Actions summary right away, instead of only after several
      # minutes of build steps.
      #
      # Inline instead of a third-party action: haythem/public-ip is
      # unmaintained (last release 2022, deprecated Node 16 runtime) and
      # does nothing more than call a public IP echo service.
      - name: Get runner public IP
        run: |
          IP=$(curl -sS https://api.ipify.org)
          echo "::notice::Runner IP to whitelist on o2switch: $IP"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # Dummy env, just enough for composer's post-install auto-scripts
      # (cache:clear, assets:install) to boot the kernel on the runner --
      # unrelated to the real production .env, which is written to the
      # server later from the DEPLOY_ENV_FILE secret.
      - name: Prepare .env for the build
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Rebuilt here (on the runner), never on the server -- no vendor/ from
      # a previous deploy sits around to accidentally corrupt.
      #
      # APP_ENV=prod: composer's post-install auto-scripts run cache:clear
      # against whatever APP_ENV the checked-out .env has (dev, from the
      # "Prepare .env for the build" step above). --no-dev just removed
      # dev-only bundles (e.g. MakerBundle) from vendor/, so warming the dev
      # container fails with a ClassNotFoundError. Forcing prod here warms
      # the prod container instead, which never references them.
      - name: Prune to production dependencies
        env:
          APP_ENV: prod
        run: composer install --prefer-dist --no-dev --optimize-autoloader --no-interaction

      # asset-map:compile requires the Tailwind output CSS to already exist on
      # disk (symfonycasts/tailwind-bundle doesn't build it as a side effect
      # of compiling the asset map) -- worked locally only because a dev
      # container already had it built from an earlier session; a fresh
      # runner checkout doesn't.
      - name: Build Tailwind CSS
        env:
          APP_ENV: prod
        run: php bin/console tailwind:build

      # AssetMapper only serves assets on-the-fly in dev -- in prod it expects
      # a precompiled public/assets/ (manifest + versioned files), or Twig's
      # importmap()/asset() helpers throw at render time (admin/login.html.twig
      # 500s). Not covered by the assets:install/importmap:install auto-scripts
      # above, which only vendor the raw sources -- this is the separate
      # "build" step.
      - name: Compile AssetMapper assets for production
        env:
          APP_ENV: prod
        run: php bin/console asset-map:compile

      # Runner IP whitelisting on o2switch is manual (cPanel > Sécurité >
      # Accès SSH) -- see the "Get runner public IP" step above for the IP
      # to add. This step just waits for that to have happened / propagated
      # before the SSH steps below try to connect.
      - name: Wait for SSH port to open
        run: |
          echo "Waiting for ${{ secrets.DEPLOY_SSH_HOST }}:22 to accept connections..."
          for i in $(seq 1 24); do
            if timeout 5 bash -c 'cat < /dev/null > /dev/tcp/${{ secrets.DEPLOY_SSH_HOST }}/22' 2>/dev/null; then
              echo "TCP connect OK after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::TCP connect to ${{ secrets.DEPLOY_SSH_HOST }}:22 still failing after 120s -- is the runner IP printed above whitelisted on o2switch, or is host/port wrong?"
          exit 1

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # ControlMaster/ControlPersist: the rsync + 3 ssh steps below each open
      # a fresh TCP+SSH handshake to a shared host that's likely not
      # geographically close to the runner -- multiplexing them over one
      # persistent connection (opened by whichever step runs first) avoids
      # paying that handshake 4 times. ControlPersist 60s keeps the socket
      # alive past the last command; harmless, the runner VM is destroyed
      # right after this job anyway.
      - name: Trust the remote host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -v "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host ${{ secrets.DEPLOY_SSH_HOST }}
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 60s
          EOF

      # TEMP DEBUG -- investigating a 500 on chatbot.jolivetmaxime.fr showing
      # a full debug-mode error page (MakerBundle autoload failure, looks
      # like the dev container). Remove once diagnosed.
      - name: Debug -- tail prod error logs
        continue-on-error: true
        run: |
          ssh "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "cd ${{ secrets.DEPLOY_PROJECT_PATH }} && echo '--- .env (first 5 lines, redacted after =) ---' && sed -E 's/=.*/=<redacted>/' .env | head -5 && echo '--- ls var/cache ---' && ls -la var/cache/ 2>&1 && echo '--- tail var/log/prod.log ---' && tail -n 60 var/log/prod.log 2>&1 && echo '--- tail var/log/dev.log ---' && tail -n 60 var/log/dev.log 2>&1"

      # var/ (cache/logs/uploaded documents) and .env are excluded from
      # --delete too, not just from the sync source: --delete removes
      # anything on the server not present here, and var/uploads/documents
      # (uploaded knowledge-base files) plus the live .env only ever exist
      # on the server, never in this checkout.
      - name: Rsync to o2switch
        run: |
          rsync -avz --delete ${{ inputs.dry_run && '--dry-run' || '' }} \
            --exclude '.env' --exclude '.env.*' \
            --exclude 'var' \
            --exclude '.git' \
            . "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:${{ secrets.DEPLOY_PROJECT_PATH }}/"

      # Piped in via env: + a here-string rather than interpolated straight
      # into the run: script, so the secret's content is never re-parsed by
      # the shell.
      - name: Deploy production .env
        if: ${{ !inputs.dry_run }}
        env:
          ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
        run: |
          ssh "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "cat > ${{ secrets.DEPLOY_PROJECT_PATH }}/.env" <<< "$ENV_FILE"

      # Only really matters for the very first deploy (creates the tracking
      # table). Harmless no-op afterwards: doctrine/migrations' status check
      # has a confirmed, unfixed upstream bug that reports this table as
      # permanently out of date on MariaDB with a non-server-default
      # collation (charset/collation platformOptions attached by
      # introspection but never set on the expected table -- see
      # https://github.com/doctrine/DoctrineMigrationsBundle/issues/484 and
      # https://github.com/doctrine/migrations/issues/1302), which is why
      # there's no "check migration status" step here -- it would always
      # fail. "Run database migrations" below is unaffected: MigrateCommand
      # calls ensureInitialized() (never throws, just alters if needed)
      # before touching executed migrations.
      - name: Sync migrations metadata storage
        if: ${{ !inputs.dry_run }}
        run: |
          ssh "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "cd ${{ secrets.DEPLOY_PROJECT_PATH }} && php bin/console doctrine:migrations:sync-metadata-storage --env=prod"

      # --env=prod explicit, not left to DEPLOY_ENV_FILE containing
      # APP_ENV=prod correctly -- an empty/misconfigured .env would
      # otherwise silently fall back to dev, which references dev-only
      # bundles (e.g. MakerBundle) stripped from the --no-dev vendor/ this
      # rsynced, crashing the same way the runner-side prune step did.
      - name: Run database migrations
        if: ${{ !inputs.dry_run }}
        run: |
          ssh "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "cd ${{ secrets.DEPLOY_PROJECT_PATH }} && php bin/console doctrine:migrations:migrate --env=prod --no-interaction"

      - name: Warm up the prod cache
        if: ${{ !inputs.dry_run }}
        run: |
          ssh "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "cd ${{ secrets.DEPLOY_PROJECT_PATH }} && php bin/console cache:clear --env=prod --no-debug"

      # Firewalled behind Basic Auth (see security.yaml), so a plain 200 is
      # not the success signal -- 401 with the right WWW-Authenticate header
      # means Symfony booted and the firewall is enforcing, which is the
      # actual thing worth confirming here.
      - name: Smoke test -- confirm the API is up and enforcing auth
        if: ${{ !inputs.dry_run }}
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -sk -o /dev/null -w '%{http_code}' "https://chatbot.jolivetmaxime.fr/api/ai_agents") && break
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "401" ] && [ "$STATUS" != "200" ]; then
            echo "::error::Expected 401 (auth required) or 200, got $STATUS -- deploy likely broken."
            exit 1
          fi
