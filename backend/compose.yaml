
services:
  app:
    build: .
    container_name: chatbot-symfony
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-!ChangeMe!}@database:3306/${MYSQL_DATABASE:-app}?serverVersion=${MYSQL_VERSION:-8.0.32}&charset=utf8mb4
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
    volumes:
      - .:/app
    depends_on:
      database:
        condition: service_healthy
      qdrant:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - proxy

###> doctrine/doctrine-bundle ###
  database:
    image: mysql:${MYSQL_VERSION:-8.0}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      # You should definitely change the password in production
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-!ChangeMe!}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_RANDOM_ROOT_PASSWORD: "true"
    ports:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-app}", "-p${MYSQL_PASSWORD:-!ChangeMe!}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/mysql:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/mysql:rw
###< doctrine/doctrine-bundle ###

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333"
      - "6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - default
      - proxy

  redis:
    image: redis:7-alpine
    networks:
      - default

  # Persistent Messenger consumer for the `async` transport (document
  # indexing, API-triggered workflow runs -- see config/packages/messenger.yaml).
  # Same image/env as `app`, different command. Not viable as-is on o2switch
  # (shared hosting has no persistent-process support) -- production needs a
  # cron-invoked `messenger:consume --limit=N --time-limit=X` instead.
  worker:
    build: .
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-!ChangeMe!}@database:3306/${MYSQL_DATABASE:-app}?serverVersion=${MYSQL_VERSION:-8.0.32}&charset=utf8mb4
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
    command: php bin/console messenger:consume async -vv --time-limit=3600
    restart: unless-stopped
    volumes:
      - .:/app
    depends_on:
      database:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default

  nuxt:
    image: node:24-alpine
    container_name: chatbot-symfony-nuxt
    working_dir: /app
    volumes:
      - ../frontend:/app
    command: sh -c "npm ci && npm run build && HOST=0.0.0.0 PORT=3000 node .output/server/index.mjs"
    ports:
      - "3010:3000"
    environment:
      - CHOKIDAR_USEPOLLING=1
      - NODE_OPTIONS="--dns-result-order=ipv4first"
      - API_URL=http://chatbot-symfony:8000
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    depends_on:
      - app
    networks:
      - default
      - proxy

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
  qdrant_data:

networks:
  default:
  # external: true -- lets this file also run standalone (`cd backend &&
  # docker compose up`, see backend/README.md) without the root compose.yaml.
  # When included from the root file, this declaration merges harmlessly
  # with the identical one there.
  proxy:
    name: chatbot-proxy
    external: true
