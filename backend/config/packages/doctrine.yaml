doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '11.4.12'

        # Explicit, not MariaDB 11's new default (utf8mb4_uca1400_ai_ci):
        # that collation is missing from
        # information_schema.COLLATION_CHARACTER_SET_APPLICABILITY on this
        # MariaDB version, and DBAL's table-options introspection INNER
        # JOINs against that view -- any table left on the server default
        # silently returns zero rows there, which crashes
        # doctrine:migrations:migrate (and :list/:status) with
        # "assert($options !== null)" the moment it needs to re-introspect
        # its own tracking table (i.e. every run after the first).
        default_table_options:
            charset: utf8mb4
            collate: utf8mb4_unicode_ci

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
