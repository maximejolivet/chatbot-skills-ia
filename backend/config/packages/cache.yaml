framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Namespaced pools use the above "app" backend by default
        #pools:
            #my.dedicated.cache: null

        # Dedicated pool for App\Chat\ConversationHistoryCache -- separate
        # from "app" above (left on its filesystem default) so this doesn't
        # affect unrelated cache usage elsewhere in the app.
        default_redis_provider: '%env(REDIS_URL)%'
        pools:
            cache.conversation_history:
                adapter: cache.adapter.redis
                default_lifetime: 3600

            # Dedicated pool for App\VectorConnector\QueryEmbeddingCache --
            # same rationale as cache.conversation_history above. Longer
            # lifetime than conversation_history: an embedding for a given
            # question text never goes stale on its own (unlike conversation
            # history, which changes every turn), the only staleness risk is
            # the active embedding model/provider changing underneath it --
            # see the class docblock for why that's an accepted tradeoff.
            cache.query_embedding:
                adapter: cache.adapter.redis
                default_lifetime: 604800 # 7 days
