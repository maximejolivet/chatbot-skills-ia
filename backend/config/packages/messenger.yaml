framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        # failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            # failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # Document chunking/vectorization and API-triggered workflow runs
            # move off the request thread -- tool-calling-triggered workflow
            # execution (ChatOrchestrationService) deliberately stays
            # synchronous instead (it needs the result immediately to
            # continue the LLM loop), so it never dispatches this message.
            'App\Message\IndexDocumentMessage': async
            'App\Message\ExecuteWorkflowMessage': async

