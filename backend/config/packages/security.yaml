security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Multi-user: each operator is a row in app_user (App\Entity\User),
    # identified by email. Replaces the old single shared ADMIN_USERNAME /
    # ADMIN_PASSWORD_HASH in-memory account -- create accounts with
    # `bin/console app:user:create` or via /admin/users.
    providers:
        admin_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        admin:
            # Human-facing backoffice: session-based login form.
            pattern: ^/admin
            lazy: true
            provider: admin_provider
            form_login:
                login_path: app_admin_login
                check_path: app_admin_login
                default_target_path: app_admin_dashboard
            logout:
                path: app_admin_logout
                target: app_admin_login
        api:
            # Everything else (API Platform /api, Swagger /doc): stateless HTTP Basic,
            # so curl/scripts/the Nuxt frontend proxy can authenticate as a service account.
            pattern: ^/
            stateless: true
            provider: admin_provider
            http_basic: ~

    # Note: Only the *first* matching rule is applied
    #
    # /(api|doc) only requires ROLE_USER (i.e. any authenticated account) --
    # ROLE_USER is the base role every account gets (User::getRoles() always
    # adds it), so this just gates "authenticated," not "admin." Per-resource
    # authorization happens below that: Conversation/WorkflowExecution allow
    # ROLE_USER but restrict *which rows* via OwnershipVoter/
    # OwnershipCollectionExtension (`security: "is_granted('OWNER', object)"`
    # on their ApiResource operations); every other resource (Document,
    # Workflow, AiAgent, AiProviderConfig, etc.) explicitly requires
    # ROLE_ADMIN on its own #[ApiResource(security: ...)] to keep today's
    # admin-only behavior -- relaxing this blanket rule does NOT open them to
    # ROLE_USER accounts.
    access_control:
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/(api|doc)(/|$), roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
