; o2switch mutualise PHP-FPM avec un OPcache agressif (validate_timestamps
; désactivé ou revalidate_freq élevé par défaut) -- sans ça, un déploiement
; ne prend effet qu'après redémarrage manuel du pool FPM (inaccessible en
; hébergement mutualisé) : les workers continuent d'exécuter le bytecode
; compilé d'un déploiement précédent tant que le TTL n'expire pas.
opcache.validate_timestamps=1
opcache.revalidate_freq=0
