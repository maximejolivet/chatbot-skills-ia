http:
  routers:
    traefik:
      rule: Host(`traefik.chatbot.localhost`)
      service: api@internal

    symfony:
      rule: Host(`symfony.chatbot.localhost`)
      service: symfony
    nuxt:
      rule: Host(`nuxt.chatbot.localhost`)
      service: nuxt
    qdrant:
      rule: Host(`qdrant.chatbot.localhost`)
      service: qdrant

  services:
    symfony:
      loadBalancer:
        servers:
          - url: http://chatbot-symfony:8000
    nuxt:
      loadBalancer:
        servers:
          - url: http://chatbot-symfony-nuxt:3000
    qdrant:
      loadBalancer:
        servers:
          # Compose service-name alias, not the auto-generated container name
          # -- stable regardless of the compose project name.
          - url: http://qdrant:6333
